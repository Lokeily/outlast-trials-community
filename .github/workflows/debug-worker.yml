name: debug-worker
on:
  workflow_dispatch: {}
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: probe new endpoints
        run: |
          BASE="https://outlast-visitors.dz3084614411.workers.dev"
          for p in "/o" "/p?vid=probetest777" "/p?vid=probetest777" "/stats?days=7"; do
            echo "=== GET $p ==="
            curl -s -o /tmp/body -w "HTTP %{http_code}\n" "$BASE$p" \
              -H "Referer: https://lokeily.github.io/outlast-trials-community/" \
              -H "User-Agent: Mozilla/5.0"
            echo "--- body ---"; head -c 240 /tmp/body; echo; echo
          done
